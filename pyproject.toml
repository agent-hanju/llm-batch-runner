[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-batch-runner"
version = "0.1.0"
description = "LLM batch runner supporting chat, Anthropic Batch API, and CLI backends"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["mypy>=1.10", "ruff>=0.4"]

[project.scripts]
llm-batch-runner = "llm_batch_runner.__main__:_main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_batch_runner"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100
